name: Mise à jour nocturne

on:
  schedule:
    - cron: "30 3 * * *"        # tous les jours à 3h30 UTC (5h30 Paris)
  workflow_dispatch:            # bouton "Run workflow" pour lancer à la main
  push:
    branches: [main]
    paths: ["site/**", "pipeline/**", ".github/workflows/**"]

permissions:
  contents: read
  issues: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && playwright install --with-deps chromium
      - name: Télécharger l'open data de l'Assemblée
        run: python pipeline/run.py fetch
      - name: Construire les données
        run: python pipeline/run.py build
      - name: Générer le site
        run: python site/build.py
      - name: Générer les cartes de partage
        run: python site/cards.py
      - name: Publier sur Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ilsvotentquoi --commit-dirty=true
      - name: Prévenir les moteurs (IndexNow)
        if: success()
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" -H "Content-Type: application/json" \
            -d "{\"host\":\"ilsvotentquoi.fr\",\"key\":\"${{ secrets.INDEXNOW_KEY }}\",\"keyLocation\":\"https://ilsvotentquoi.fr/${{ secrets.INDEXNOW_KEY }}.txt\",\"urlList\":[\"https://ilsvotentquoi.fr/\",\"https://ilsvotentquoi.fr/sitemap.xml\"]}" || true
      - name: Rapport
        run: |
          echo "### Textes classés automatiquement (absents de pipeline/textes_themes.json)" >> $GITHUB_STEP_SUMMARY
          python -c "import json;d=json.load(open('data/textes_sans_theme.json'));print('\n'.join(f\"- {k} → {'/'.join(v['themes'])} ({v['votes']} votes, {v['confiance']})\" for k,v in sorted(d.items(),key=lambda x:-x[1]['votes'])) or 'aucun')" >> $GITHUB_STEP_SUMMARY
      - name: Alerte en cas d'échec
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Échec de la mise à jour nocturne du $(date -u +%Y-%m-%d)" \
            --body "Le run a échoué : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Le site reste sur sa version précédente. Si le run suivant passe, cette issue peut être fermée." || true
